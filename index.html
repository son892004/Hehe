<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz 2A - Bài 5</title>
<style>
  :root {
    --primary: #059669;
    --primary-hover: #047857;
    --bg-gradient: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
    --card-bg: #ffffff;
    --text-main: #065f46;
    --text-muted: #475569;
    --correct-bg: #dcfce7;
    --correct-border: #22c55e;
    --correct-text: #15803d;
    --wrong-bg: #fee2e2;
    --wrong-border: #ef4444;
    --wrong-text: #b91c1c;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    margin: 0;
    padding: 20px 12px;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #1e293b;
  }

  .card {
    width: 100%;
    max-width: 650px;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 6px 0;
    color: var(--text-main);
  }

  .sub {
    color: var(--text-muted);
    font-size: 14px;
  }

  .progress-container {
    height: 10px;
    background: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 16px;
  }

  .progress-bar {
    height: 100%;
    background: var(--primary);
    width: 0%;
    transition: width 0.3s ease;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    margin: 16px 0 20px 0;
    font-weight: 600;
    font-size: 15px;
    color: var(--text-muted);
  }

  .question-box {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    margin: 20px 0 28px 0;
    color: #0f172a;
    min-height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .answers-grid {
    display: grid;
    gap: 12px;
  }

  .answer-btn {
    padding: 16px 20px;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    background: #f8fafc;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #1e293b;
  }

  .answer-btn:hover:not(:disabled) {
    background: #ecfdf5;
    border-color: var(--primary);
  }

  .answer-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct-border);
    color: var(--correct-text);
  }

  .answer-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong-border);
    color: var(--wrong-text);
  }

  .feedback {
    text-align: center;
    min-height: 28px;
    margin: 16px 0;
    font-weight: 700;
    font-size: 16px;
  }

  .next-btn, .restart-btn {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 16px;
    background: var(--primary);
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .next-btn:hover, .restart-btn:hover {
    background: var(--primary-hover);
  }

  .settings {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #f1f5f9;
  }

  .settings select {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    font-size: 14px;
    color: #1e293b;
    font-weight: 500;
  }

  .hidden { display: none !important; }

  .result-box { text-align: center; padding: 20px 0; }

  .final-score {
    font-size: 52px;
    font-weight: 900;
    color: var(--primary);
    margin: 12px 0;
  }

  .result-msg {
    font-size: 17px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Quiz Section -->
  <div id="quiz-section">
    <header>
      <h1>🇰🇷 Quiz 2A — Bài 5</h1>
      <div class="sub">Chủ đề: 어디에 가면 좋을까요? (Du lịch & Lịch trình)</div>
    </header>

    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div class="meta">
      <span id="counter">Câu 1/10</span>
      <span id="score">Điểm: 0</span>
    </div>

    <div id="question" class="question-box"></div>
    <div id="answers" class="answers-grid"></div>
    <div id="feedback" class="feedback"></div>

    <button id="next-btn" class="next-btn hidden">Câu tiếp theo →</button>

    <div class="settings">
      <select id="mode-select">
        <option value="ko">🇰🇷 Hàn → Việt</option>
        <option value="vi">🇻🇳 Việt → Hàn</option>
      </select>
      <select id="amount-select">
        <option value="10">10 câu</option>
        <option value="20">20 câu</option>
        <option value="30">30 câu</option>
        <option value="81">Tất cả (81 câu)</option>
      </select>
    </div>
  </div>

  <!-- Result Section -->
  <div id="result-section" class="result-box hidden">
    <h1>🎉 Hoàn thành!</h1>
    <div id="final-score" class="final-score">0/0</div>
    <p id="result-message" class="result-msg"></p>
    <button id="restart-btn" class="restart-btn">🔄 Làm lại bài Quiz</button>
  </div>
</div>

<script>
  const WORDS = [
    // S【5과】
    {"ko": "기간", "vi": "Thời gian / Thời hạn"},
    {"ko": "교통편", "vi": "Phương tiện giao thông"},
    {"ko": "숙소", "vi": "Chỗ ở / Nơi lưu trú"},
    {"ko": "요금", "vi": "Cước phí / Giá tiền"},
    {"ko": "일정", "vi": "Lịch trình"},
    {"ko": "항공료", "vi": "Vé máy bay / Cước phí hàng không"},
    {"ko": "숙박비", "vi": "Chi phí lưu trú / Tiền phòng"},
    {"ko": "식비", "vi": "Tiền ăn"},
    {"ko": "입장료", "vi": "Vé vào cửa / Phí vào cổng"},
    {"ko": "여행자 보험료", "vi": "Phí bảo hiểm du lịch"},
    {"ko": "항공권", "vi": "Vé máy bay"},
    {"ko": "왕복", "vi": "Khứ hồi"},
    {"ko": "편도", "vi": "Một chiều"},
    {"ko": "출발", "vi": "Xuất phát / Khởi hành"},
    {"ko": "도착", "vi": "Đến nơi / Đến"},
    {"ko": "출국 날짜", "vi": "Ngày xuất cảnh"},
    {"ko": "귀국 날짜", "vi": "Ngày về nước"},
    {"ko": "좌석", "vi": "Chỗ ngồi / Ghế"},
    {"ko": "일반석", "vi": "Hạng phổ thông"},
    {"ko": "비즈니스석", "vi": "Hạng thương gia"},
    {"ko": "일등석", "vi": "Hạng nhất"},
    {"ko": "아마", "vi": "Có lẽ / Có thể"},
    {"ko": "담배를 끊다", "vi": "Bỏ thuốc lá"},
    {"ko": "돈을 모으다", "vi": "Tiết kiệm tiền"},
    {"ko": "전통문화", "vi": "Văn hóa truyền thống"},
    {"ko": "느끼다", "vi": "Cảm nhận / Cảm thấy"},
    {"ko": "패키지여행", "vi": "Du lịch trọn gói (Tour)"},
    {"ko": "알아보다", "vi": "Tìm hiểu / Hỏi thăm"},
    {"ko": "공연", "vi": "Buổi biểu diễn"},
    {"ko": "거리", "vi": "Khoảng cách / Cự ly"},
    {"ko": "며칠", "vi": "Mấy ngày / Ngày mấy"},
    {"ko": "바라다", "vi": "Mong muốn / Hi vọng"},
    {"ko": "박 (1박 2일)", "vi": "Đêm (1 đêm 2 ngày)"},
    {"ko": "자세하다", "vi": "Chi tiết / Tỉ mỉ"},
    {"ko": "여행지", "vi": "Điểm du lịch"},
    {"ko": "방법", "vi": "Phương pháp / Cách thức"},
    {"ko": "생각하다", "vi": "Suy nghĩ"},
    {"ko": "대학원", "vi": "Cao học"},
    {"ko": "마치다", "vi": "Hoàn thành / Kết thúc"},
    {"ko": "여행 상품", "vi": "Sản phẩm du lịch / Tour"},
    {"ko": "포함되어 있다", "vi": "Được bao gồm"},
    {"ko": "당일", "vi": "Trong ngày"},
    {"ko": "추천하다", "vi": "Giới thiệu / Gợi ý"},
    {"ko": "부석사", "vi": "Chùa Buseok"},
    {"ko": "거제도", "vi": "Đảo Geoje"},
    {"ko": "빈방", "vi": "Phòng trống"},
    {"ko": "가이드", "vi": "Hướng dẫn viên du lịch"},
    {"ko": "동서양", "vi": "Đông Tây"},
    {"ko": "사이", "vi": "Khoảng giữa / Giữa"},
    {"ko": "동양", "vi": "Phương Đông"},
    {"ko": "서양", "vi": "Phương Tây"},
    {"ko": "오래되다", "vi": "Lâu đời / Cũ"},
    {"ko": "건축물", "vi": "Công trình kiến trúc"},
    {"ko": "자연", "vi": "Tự nhiên / Thiên nhiên"},
    {"ko": "등", "vi": "Vân vân (v.v...)"},
    {"ko": "다양하다", "vi": "Đa dạng / Phong phú"},
    {"ko": "가지고 가다", "vi": "Mang đi / Cầm đi"},
    {"ko": "콘도", "vi": "Căn hộ du lịch / Condo"},
    {"ko": "펜션", "vi": "Biệt thự nghỉ dưỡng / Pension"},
    {"ko": "게스트하우스", "vi": "Nhà khách / Guesthouse"},
    {"ko": "민박", "vi": "Nhà dân cho thuê trọ"},
    {"ko": "이용하다", "vi": "Sử dụng"},
    {"ko": "한옥", "vi": "Nhà truyền thống Hanok"},
    {"ko": "전통적", "vi": "Mang tính truyền thống"},
    {"ko": "분위기", "vi": "Bầu không khí"},
    {"ko": "대통령", "vi": "Tổng thống"},
    {"ko": "종류", "vi": "Loại / Chủng loại"},
    {"ko": "등록금", "vi": "Tiền học phí"},

    // W【5과】
    {"ko": "이용하다", "vi": "Sử dụng / Dùng"},
    {"ko": "알려 주다", "vi": "Cho biết / Cho hay"},
    {"ko": "성인", "vi": "Người lớn / Trưởng thành"},
    {"ko": "일기 예보", "vi": "Dự báo thời tiết"},
    {"ko": "아마", "vi": "Có lẽ"},
    {"ko": "길이 막히다", "vi": "Tắc đường / Kẹt xe"},
    {"ko": "싸게 사다", "vi": "Mua rẻ"},
    {"ko": "건강", "vi": "Sức khỏe"},
    {"ko": "무료", "vi": "Miễn phí"},
    {"ko": "조용히", "vi": "Lặng lẽ / Yên tĩnh"},
    {"ko": "준비운동하다", "vi": "Tập bài tập chuẩn bị / Khởi động"},
    {"ko": "결정하다", "vi": "Quyết định"},
    {"ko": "졸업하다", "vi": "Tốt nghiệp"}
  ];

  let pool = [];
  let currentIndex = 0;
  let score = 0;
  let isAnswered = false;

  const quizSection = document.getElementById("quiz-section");
  const resultSection = document.getElementById("result-section");
  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const feedbackEl = document.getElementById("feedback");
  const counterEl = document.getElementById("counter");
  const scoreEl = document.getElementById("score");
  const progressBar = document.getElementById("progress-bar");
  const nextBtn = document.getElementById("next-btn");
  const restartBtn = document.getElementById("restart-btn");
  const modeSelect = document.getElementById("mode-select");
  const amountSelect = document.getElementById("amount-select");
  const finalScoreEl = document.getElementById("final-score");
  const resultMessageEl = document.getElementById("result-message");

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz() {
    const amount = parseInt(amountSelect.value, 10);
    pool = shuffle(WORDS).slice(0, amount);
    currentIndex = 0;
    score = 0;

    quizSection.classList.remove("hidden");
    resultSection.classList.add("hidden");
    loadQuestion();
  }

  function loadQuestion() {
    isAnswered = false;
    const currentItem = pool[currentIndex];
    const mode = modeSelect.value;

    const promptText = mode === "ko" ? currentItem.ko : currentItem.vi;
    const correctAnswer = mode === "ko" ? currentItem.vi : currentItem.ko;

    counterEl.textContent = `Câu ${currentIndex + 1}/${pool.length}`;
    scoreEl.textContent = `Điểm: ${score}`;
    progressBar.style.width = `${(currentIndex / pool.length) * 100}%`;
    questionEl.textContent = promptText;
    feedbackEl.textContent = "";
    nextBtn.classList.add("hidden");

    const otherItems = shuffle(WORDS.filter(w => w.ko !== currentItem.ko)).slice(0, 3);
    let choices = [correctAnswer];
    otherItems.forEach(item => {
      choices.push(mode === "ko" ? item.vi : item.ko);
    });
    choices = shuffle(choices);

    answersEl.innerHTML = "";
    choices.forEach((choice, idx) => {
      const btn = document.createElement("button");
      btn.className = "answer-btn";
      btn.textContent = `${String.fromCharCode(65 + idx)}. ${choice}`;
      btn.onclick = () => handleAnswer(choice, correctAnswer, btn);
      answersEl.appendChild(btn);
    });
  }

  function handleAnswer(selectedChoice, correctAnswer, selectedBtn) {
    if (isAnswered) return;
    isAnswered = true;

    const allButtons = answersEl.querySelectorAll(".answer-btn");
    allButtons.forEach(btn => btn.disabled = true);

    if (selectedChoice === correctAnswer) {
      score++;
      selectedBtn.classList.add("correct");
      feedbackEl.textContent = "✅ Chính xác!";
      feedbackEl.style.color = "var(--correct-text)";
    } else {
      selectedBtn.classList.add("wrong");
      allButtons.forEach(btn => {
        if (btn.textContent.slice(3) === correctAnswer) {
          btn.classList.add("correct");
        }
      });
      feedbackEl.textContent = `❌ Sai rồi! Đáp án đúng: ${correctAnswer}`;
      feedbackEl.style.color = "var(--wrong-text)";
    }

    scoreEl.textContent = `Điểm: ${score}`;
    nextBtn.classList.remove("hidden");
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < pool.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    const percentage = Math.round((score / pool.length) * 100);
    quizSection.classList.add("hidden");
    resultSection.classList.remove("hidden");

    finalScoreEl.textContent = `${score}/${pool.length} (${percentage}%)`;

    if (percentage >= 90) {
      resultMessageEl.textContent = "🔥 Xuất sắc! Bạn thuộc từ vựng Bài 5 rất siêu.";
    } else if (percentage >= 70) {
      resultMessageEl.textContent = "👏 Khá tốt! Luyện tập thêm chút nữa là hoàn hảo.";
    } else if (percentage >= 50) {
      resultMessageEl.textContent = "💪 Tạm ổn! Hãy thử lại để tăng điểm nhé.";
    } else {
      resultMessageEl.textContent = "📚 Cố lên! Hãy ôn lại từ vựng Bài 5 và làm lại.";
    }
  }

  nextBtn.onclick = nextQuestion;
  restartBtn.onclick = startQuiz;
  modeSelect.onchange = startQuiz;
  amountSelect.onchange = startQuiz;

  startQuiz();
</script>

</body>
</html>
